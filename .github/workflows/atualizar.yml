name: Atualizar Lista IPTV

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar yt-dlp
        run: pip install -U yt-dlp

      - name: Gerar lista.m3u atualizada
        env:
          COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$COOKIES" ]; then
            echo "$COOKIES" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
          else
            COOKIE_ARG=""
          fi

          # 1. Busca link atualizado do SBT Belém-PA
          LINK_SBT=$(yt-dlp $COOKIE_ARG --geo-bypass-country BR --socket-timeout 15 --no-playlist -g "https://youtube.com" 2>/dev/null | head -n 1 || echo "")
          rm -f cookies.txt

          if [ -z "$LINK_SBT" ]; then
            LINK_SBT="https://googlevideo.com"
          fi

                    # 2. Busca token atualizado da La Tele (Paraguai)
          PLAYER_URL=$(curl -sL -A "Mozilla/5.0" "https://www.latele.com.py/en-vivo" | grep -oE "https://[^\"']*desdeparaguay[^\"']*" | head -n 1 || echo "")
          if [ -n "$PLAYER_URL" ]; then
            LINK_LATELE=$(curl -sL -A "Mozilla/5.0" -e "https://www.latele.com.py/en-vivo" "$PLAYER_URL" | grep -oE "https://[^\"']*desdeparaguay\.net/latele/[^\"']*\.m3u8[^\"']*" | head -n 1 || echo "")
          fi
          if [ -z "$LINK_LATELE" ]; then
            LINK_LATELE="https://desdeparaguay.net"
          fi


          cat << EOF > lista.m3u
          #EXTM3U

          # Canais Abertos

          #EXTINF:-02 tvg-name="TV Cultura-PA HD" tvg-logo="https://google.com" group-title="Canais | Abertos",TV Cultura-PA HD
          https://portalcultura.com.br

          #EXTINF:-04 tvg-name="Globo TV Liberal Belém HD" tvg-logo="https://wikimedia.org" group-title="Canais | Abertos",Globo TV Liberal Belém HD
          https://livestream.st

          #EXTINF:-05 tvg-name="TV RBA HD" tvg-logo="https://mitvstatic.com" group-title="Canais | Abertos",TV RBA HD
          https://streamlock.net

          #EXTINF:-06 tvg-name="TV Record Belém HD" tvg-logo="https://mitvstatic.com" group-title="Canais | Abertos",TV Record Belém HD
          https://cdnsimba.com.br

          #EXTINF:-07 tvg-name="Record News HD" tvg-logo="https://mitvstatic.com" group-title="Canais | Abertos",Record News HD
          https://otteravision.com

          #EXTINF:-08 tvg-name="SBT Belém-PA HD" tvg-logo="https://mitvstatic.com" group-title="Canais | Abertos",SBT Belém-PA HD
          $LINK_SBT

          #EXTINF:-09 tvg-name="SBT Pará HD" tvg-logo="https://portaltvparaense.com.br" group-title="Canais | Abertos",SBT | TV Paraense Castanhal-PA HD
          https://jmvstream.com

          #EXTINF:-10 tvg-name="SBT Pará HD" tvg-logo="https://googleapis.com" group-title="Canais | Abertos",SBT | TV Guajará Tailândia-PA HD
          https://logicahost.com.br

          #EXTINF:-11 tvg-name="SBT Pará HD" tvg-logo="https://wixstatic.com" group-title="Canais | Abertos",SBT | TV Floresta Tucuruí-PA
          https://logicahost.com.br

          #EXTINF:-12 tvg-name="Rede Brasil - TV Marajoara-PA" tvg-logo="https://tvmarajoara.com.br" group-title="Canais | Abertos",Rede Brasil - TV Marajoara-PA HD
          https://zas.media

          #EXTINF:-13 tvg-name="TV Grão Pará" tvg-logo="https://googleusercontent.com" group-title="Canais | Abertos",TV Grão Pará HD
          https://kshost.com.br

          #EXTINF:-14 tvg-name="TV One" tvg-logo="https://tvone.com.br" group-title="Canais | Abertos",TV One HD
          https://logicahost.com.br

          #EXTINF:-15 tvg-name="MULTIMÉDIOS HD" tvg-logo="https://pinimg.com" group-title="Canais | Variedades",MULTIMÉDIOS HD
          https://mdstrm.com

          #EXTINF:-16 tvg-name="La Tele HD" tvg-logo="https://wikimedia.org" group-title="Canais | Variedades",La Tele HD
          #EXTVLCOPT:http-referer=https://latele.com.py
          $LINK_LATELE
          EOF

          sed -i 's/^[ \t]*//' lista.m3u

      - name: Salvar arquivo no GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add lista.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualiza lista de canais" && git push)
