name: Atualizar Lista IPTV

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar yt-dlp
        run: pip install -U yt-dlp

      - name: Gerar lista.m3u atualizada
        run: |
          LINK=$(yt-dlp --extractor-args "youtube:player_client=android,web" -g "https://youtube.com")
          echo "#EXTM3U" > lista.m3u
          echo '#EXTINF:-1 tvg-name="TV Norte SBT Pará",TV Norte SBT Pará' >> lista.m3u
          echo "$LINK" >> lista.m3u

      - name: Salvar arquivo no GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add lista.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualiza link m3u8" && git push)
